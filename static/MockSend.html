<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟弹幕发送</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 600px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 16px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
            max-height: 200px;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #666;
            border: 2px solid #e0e0e0;
        }
        
        .btn-secondary:hover {
            background: #e8e8e8;
            border-color: #d0d0d0;
        }
        
        .status {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .danmaku-preview {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .danmaku-preview h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .danmaku-content {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            font-size: 14px;
            line-height: 1.5;
            color: #555;
        }
        
        .connection-status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .connection-status.connected {
            background: #d4edda;
            color: #155724;
        }
        
        .connection-status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .connection-status.connecting {
            background: #fff3cd;
            color: #856404;
        }
        
        /* 批量发送控制区域样式 */
        .batch-control {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 25px;
            margin: 30px -25px -25px -25px;
        }
        
        .batch-title {
            color: #495057;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .batch-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.7);
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }
    </style>
</head>
<body>
    <div class="connection-status disconnected" id="connectionStatus">未连接</div>

        <h1>🎬 模拟弹幕发送器</h1>
        
        <form id="danmakuForm">
            <div class="form-group">

            </div>
            
            <div class="form-group">

            <div class="form-group">

                <select id="danmuType" name="danmuType">
                    <option value="danmaku">📝 普通弹幕</option>
                    <option value="super_chat">💰 超级留言</option>
                    <option value="gift">🎁 礼物</option>
                    <option value="buy_guard">🛡️ 购买守护</option>
                </select>
            </div>
            
            <div class="danmaku-preview" id="preview" style="display: none;">
                <h3>预览</h3>
                <div class="danmaku-content" id="previewContent"></div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-primary">发送弹幕</button>
                <button type="button" class="btn-secondary" id="clearBtn">清空</button>
            </div>
        </form>
        
        <!-- 批量发送控制区域 -->
        <div class="batch-control">
            <h2 class="batch-title">🚀 批量弹幕发送</h2>
            
            <div class="form-group">
                <label for="batchTopic">话题类型</label>
                <select id="batchTopic" name="batchTopic">
                    <option value="gaming">🎮 游戏相关</option>
                    <option value="food">🍔 美食相关</option>
                    <option value="study">📚 学习相关</option>
                    <option value="emotion">😂 情绪表达</option>
                    <option value="symbols">❤️ 符号表情</option>
                    <option value="simple">👍 简单词汇</option>
                    <option value="spam">🔢 重复刷屏</option>
                    <option value="interaction">💬 互动类</option>
                    <option value="question">❓ 质疑类</option>
                    <option value="super_chat">💰 超级留言</option>
                    <option value="gift">🎁 礼物</option>
                    <option value="buy_guard">🛡️ 购买守护</option>
                    <option value="mixed">🎲 混合类型</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="batchCount">发送数量</label>
                <input type="number" id="batchCount" name="batchCount" value="50" min="1" max="1000" required>
                <small style="color: #666;">建议: 50-200条模拟真实直播间</small>
            </div>
            
            <div class="form-group">
                <label for="batchInterval">发送间隔 (毫秒)</label>
                <input type="number" id="batchInterval" name="batchInterval" value="100" min="10" max="5000" required>
                <small style="color: #666;">建议: 50-500ms，越小越密集</small>
            </div>
            
            <div class="form-group">
                <label for="batchUsername">批量用户名模式</label>
                <select id="batchUsername" name="batchUsername">
                    <option value="random">🎲 随机生成</option>
                    <option value="fixed">📛 固定用户名</option>
                    <option value="numbered">🔢 编号用户</option>
                </select>
            </div>
            
            <div class="form-group" id="fixedUsernameGroup" style="display: none;">
                <label for="fixedUsername">固定用户名</label>
                <input type="text" id="fixedUsername" name="fixedUsername" placeholder="请输入固定用户名">
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-primary" id="startBatchBtn">🚀 开始批量发送</button>
                <button type="button" class="btn-secondary" id="stopBatchBtn" disabled>⏹️ 停止发送</button>
            </div>
            
            <!-- 进度条和统计信息 -->
            <div id="batchProgress" style="display: none;">
                <div class="batch-stats">
                    <span id="batchProgressText">准备开始...</span>
                    <span id="batchSpeedText">速度: 0条/秒</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            
            <div id="batchStatus"></div>
        </div>
        
        <div id="status"></div>
    </div>

        class MockDanmakuSender {
            constructor() {
                this.ws = null;
                this.reconnectInterval = 5000;
                this.maxReconnectAttempts = 5;
                this.reconnectAttempts = 0;
                this.isConnecting = false;
                
                // 批量发送相关属性
                this.isBatchSending = false;
                this.batchInterval = null;
                this.sentCount = 0;
                this.targetCount = 0;
                
                this.initElements();
                this.initEventListeners();
                this.connect();
            }
            
            initElements() {
                this.form = document.getElementById('danmakuForm');
                this.usernameInput = document.getElementById('username');
                this.messageInput = document.getElementById('message');
                this.danmuTypeSelect = document.getElementById('danmuType');
                this.preview = document.getElementById('preview');
                this.previewContent = document.getElementById('previewContent');
                this.status = document.getElementById('status');
                this.connectionStatus = document.getElementById('connectionStatus');
                this.clearBtn = document.getElementById('clearBtn');
            }
            
            initEventListeners() {
                this.form.addEventListener('submit', (e) => this.handleSubmit(e));
                this.clearBtn.addEventListener('click', () => this.clearForm());
                this.usernameInput.addEventListener('input', () => this.updatePreview());
                this.messageInput.addEventListener('input', () => this.updatePreview());
                this.danmuTypeSelect.addEventListener('change', () => this.updatePreview());
                
                // 批量发送控制事件
                document.getElementById('startBatchBtn').addEventListener('click', () => this.startBatchSend());
                document.getElementById('stopBatchBtn').addEventListener('click', () => this.stopBatchSend());
                document.getElementById('batchUsername').addEventListener('change', (e) => {
                    const fixedGroup = document.getElementById('fixedUsernameGroup');
                    fixedGroup.style.display = e.target.value === 'fixed' ? 'block' : 'none';
                });
                
                // 监听Enter键发送，Shift+Enter换行
                this.messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.handleSubmit(e);
                    }
                });
            }
            
            handleMessage(data) {
                // 处理收到的消息
                if (data.type === 'danmaku_response') {
                    if (data.success) {
                        this.showStatus(`弹幕发送成功: ${data.message}`, 'success');
                        this.clearForm();
                    } else {
                        this.showStatus(`弹幕发送失败: ${data.error}`, 'error');
                    }
                }
            }
            
            connect() {
                if (this.isConnecting || (this.ws && this.ws.readyState === WebSocket.OPEN)) {
                    return;
                }
                
                this.isConnecting = true;
                this.updateConnectionStatus('connecting', '连接中...');
                
                try {
                    // 连接到主服务器的WebSocket
                    this.ws = new WebSocket(`ws://localhost:3456/ws`);
                    
                    this.ws.onopen = () => {
                        console.log('WebSocket连接成功');
                        this.isConnecting = false;
                        this.reconnectAttempts = 0;
                        this.updateConnectionStatus('connected', '已连接');
                        this.showStatus('WebSocket连接成功', 'success');
                    };
                    
                    this.ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            console.log('收到消息:', data);
                            this.handleMessage(data);
                        } catch (error) {
                            console.error('解析消息失败:', error);
                        }
                    };
                    
                    this.ws.onclose = () => {
                        console.log('WebSocket连接关闭');
                        this.isConnecting = false;
                        this.updateConnectionStatus('disconnected', '未连接');
                        this.scheduleReconnect();
                    };
                    
                    this.ws.onerror = (error) => {
                        console.error('WebSocket错误:', error);
                        this.isConnecting = false;
                        this.updateConnectionStatus('disconnected', '连接错误');
                        this.showStatus('WebSocket连接错误', 'error');
                    };
                    
                } catch (error) {
                    console.error('创建WebSocket失败:', error);
                    this.isConnecting = false;
                    this.updateConnectionStatus('disconnected', '连接失败');
                    this.scheduleReconnect();
                }
            }
            
            async handleSubmit(e) {
                e.preventDefault();
                
                if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
                    this.showStatus('WebSocket未连接，请稍后再试', 'error');
                    return;
                }
                
                const username = this.usernameInput.value.trim();
                const message = this.messageInput.value.trim();
                const danmuType = this.danmuTypeSelect.value;
                
                if (!username || !message) {
                    this.showStatus('请填写用户名和弹幕内容', 'error');
                    return;
                }
                
                try {
                    // 通过WebSocket发送消息到主服务器
                    const danmakuData = {
                        type: 'danmaku',
                        username: username,
                        message: message,
                        danmu_type: danmuType,  // 添加消息类型
                        timestamp: new Date().toISOString()
                    };
                    
                    this.ws.send(JSON.stringify(danmakuData));
                    console.log('发送弹幕:', danmakuData);
                    
                    const typeText = {
                        'danmaku': '普通弹幕',
                        'super_chat': '超级留言',
                        'gift': '礼物',
                        'buy_guard': '购买守护'
                    }[danmuType];
                    this.showStatus(`${typeText}发送中...`, 'info');
                    
                } catch (error) {
                    console.error('发送弹幕失败:', error);
                    this.showStatus('发送弹幕失败: ' + error.message, 'error');
                }
            }
            
            updatePreview() {
                const username = this.usernameInput.value.trim();
                const message = this.messageInput.value.trim();
                const danmuType = this.danmuTypeSelect.value;
                
                if (username && message) {
                    this.preview.style.display = 'block';
                    const typeText = {
                        'danmaku': '普通弹幕',
                        'super_chat': '超级留言',
                        'gift': '礼物',
                        'buy_guard': '购买守护'
                    }[danmuType];
                    this.previewContent.textContent = `${username}发送${typeText}：${message}`;
                } else {
                    this.preview.style.display = 'none';
                }
            }
            
            clearForm() {
                this.messageInput.value = '';
                this.preview.style.display = 'none';
                this.messageInput.focus();
            }
            
            showStatus(text, type) {
                this.status.textContent = text;
                this.status.className = `status ${type}`;
                this.status.style.display = 'block';
                
                // 3秒后自动隐藏状态信息
                setTimeout(() => {
                    this.status.style.display = 'none';
                }, 3000);
            }
            
            // 批量发送功能
            async startBatchSend() {
                if (this.isBatchSending) {
                    this.showBatchStatus('批量发送已在进行中', 'error');
                    return;
                }
                
                const topic = document.getElementById('batchTopic').value;
                const count = parseInt(document.getElementById('batchCount').value);
                const interval = parseInt(document.getElementById('batchInterval').value);
                const usernameMode = document.getElementById('batchUsername').value;
                const fixedUsername = document.getElementById('fixedUsername').value;
                
                if (count < 1 || count > 1000) {
                    this.showBatchStatus('发送数量必须在1-1000之间', 'error');
                    return;
                }
                
                if (interval < 10 || interval > 5000) {
                    this.showBatchStatus('发送间隔必须在10-5000毫秒之间', 'error');
                    return;
                }
                
                // 开始批量发送
                this.isBatchSending = true;
                this.sentCount = 0;
                this.targetCount = count;
                this.startTime = Date.now();
                
                // 更新UI状态
                document.getElementById('startBatchBtn').disabled = true;
                document.getElementById('stopBatchBtn').disabled = false;
                document.getElementById('batchProgress').style.display = 'block';
                
                this.showBatchStatus(`开始批量发送 ${count} 条${topic}类型弹幕...`, 'info');
                this.updateProgress();
                
                // 开始发送循环
                this.batchInterval = setInterval(() => {
                    if (this.sentCount >= this.targetCount) {
                        this.stopBatchSend();
                        return;
                    }
                    
                    this.sendRandomDanmaku(topic, usernameMode, fixedUsername);
                    this.sentCount++;
                    
                    // 更新进度和统计
                    this.updateProgress();
                    
                }, interval);
            }
            
            updateProgress() {
                const progress = Math.round((this.sentCount / this.targetCount) * 100);
                const elapsed = (Date.now() - this.startTime) / 1000; // 秒
                const speed = this.sentCount / Math.max(elapsed, 0.1); // 条/秒
                const remaining = this.targetCount - this.sentCount;
                const eta = remaining / Math.max(speed, 0.1); // 预计剩余时间（秒）
                
                // 更新进度条
                document.getElementById('progressFill').style.width = `${progress}%`;
                
                // 更新统计信息
                document.getElementById('batchProgressText').textContent = 
                    `进度: ${this.sentCount}/${this.targetCount} (${progress}%)`;
                document.getElementById('batchSpeedText').textContent = 
                    `速度: ${speed.toFixed(1)}条/秒, 预计剩余: ${eta.toFixed(1)}秒`;
            }
            
            stopBatchSend() {
                if (this.batchInterval) {
                    clearInterval(this.batchInterval);
                    this.batchInterval = null;
                }
                
                this.isBatchSending = false;
                
                // 恢复UI状态
                document.getElementById('startBatchBtn').disabled = false;
                document.getElementById('stopBatchBtn').disabled = true;
                
                // 隐藏进度条
                setTimeout(() => {
                    document.getElementById('batchProgress').style.display = 'none';
                    document.getElementById('progressFill').style.width = '0%';
                }, 2000);
                
                if (this.sentCount > 0) {
                    const elapsed = (Date.now() - this.startTime) / 1000;
                    const avgSpeed = this.sentCount / Math.max(elapsed, 0.1);
                    this.showBatchStatus(`批量发送完成！共发送 ${this.sentCount} 条弹幕，平均速度 ${avgSpeed.toFixed(1)} 条/秒`, 'success');
                } else {
                    this.showBatchStatus('批量发送已停止', 'info');
                }
            }
            
            sendRandomDanmaku(topic, usernameMode, fixedUsername) {
                try {
                    // 获取弹幕内容
                    let content;
                    let danmuType = 'danmaku';
                    
                    if (topic === 'mixed') {
                        // 混合类型，随机选择所有类型
                        const allTypes = Object.keys(DANMAKU_TEMPLATES);
                        const randomType = allTypes[Math.floor(Math.random() * allTypes.length)];
                        const templates = DANMAKU_TEMPLATES[randomType];
                        content = templates[Math.floor(Math.random() * templates.length)];
                        danmuType = randomType;
                    } else {
                        const templates = DANMAKU_TEMPLATES[topic];
                        content = templates[Math.floor(Math.random() * templates.length)];
                        danmuType = topic;
                    }
                    
                    // 生成用户名
                    let username;
                    switch (usernameMode) {
                        case 'random':
                            username = this.generateRandomUsername();
                            break;
                        case 'fixed':
                            username = fixedUsername || '批量用户';
                            break;
                        case 'numbered':
                            username = `用户${this.sentCount + 1}`;
                            break;
                        default:
                            username = this.generateRandomUsername();
                    }
                    
                    // 通过WebSocket发送消息到主服务器
                    const danmakuData = {
                        type: 'danmaku',
                        username: username,
                        message: content,
                        danmu_type: 'danmaku',  // 添加消息类型
                        timestamp: new Date().toISOString()
                    };
                    
                    this.ws.send(JSON.stringify(danmakuData));
                    
                } catch (error) {
                    console.error('发送随机弹幕失败:', error);
                }
            }
            
            generateRandomUsername() {
                const adjectives = ['可爱的', '聪明的', '勇敢的', '善良的', '帅气的', '美丽的', '机智的', '幽默的'];
                const nouns = ['小猫', '小狗', '小鸟', '小鱼', '小熊', '小兔', '小鹿', '小马'];
                const numbers = Math.floor(Math.random() * 1000) + 100;
                
                const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
                const noun = nouns[Math.floor(Math.random() * nouns.length)];
                
                return `${adj}${noun}${numbers}`;
            }
            
            showBatchStatus(text, type) {
                const batchStatus = document.getElementById('batchStatus');
                batchStatus.textContent = text;
                batchStatus.className = `status ${type}`;
                batchStatus.style.display = 'block';
                
                // 5秒后自动隐藏状态信息
                setTimeout(() => {
                    if (!this.isBatchSending) {
                        batchStatus.style.display = 'none';
                    }
                }, 5000);
            }
            
            updateConnectionStatus(status, text) {
                this.connectionStatus.textContent = text;
                this.connectionStatus.className = `connection-status ${status}`;
            }
            
            scheduleReconnect() {
                if (this.reconnectAttempts >= this.maxReconnectAttempts) {
                    this.showStatus('重连失败，请刷新页面重试', 'error');
                    return;
                }
                
                this.reconnectAttempts++;
                const delay = this.reconnectInterval * this.reconnectAttempts;
                
                console.log(`${delay/1000}秒后尝试第${this.reconnectAttempts}次重连...`);
                this.updateConnectionStatus('connecting', `重连中(${this.reconnectAttempts}/${this.maxReconnectAttempts})...`);
                
                setTimeout(() => {
                    this.connect();
                }, delay);
            }
            
            disconnect() {
                if (this.ws) {
                    this.ws.close();
                    this.ws = null;
                }
            }
        }
        
        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            const sender = new MockDanmakuSender();
            
            // 页面卸载时断开连接
            window.addEventListener('beforeunload', () => {
                sender.disconnect();
            });
        });
    </script>
</body>
</html>
