<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>three-vrm example</title>
		<link rel="stylesheet" href="fontawesome/css/all.min.css">
		<link rel="stylesheet" href="css/vrm.css">
		<script src="js/locales.js"></script>
		<link rel="stylesheet" href="node_modules/element-plus/dist/index.css">
		<script src="node_modules/vue/dist/vue.global.js"></script>
		<script src="node_modules/element-plus/dist/index.full.js"></script>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<style>
			body.electron {
			background: transparent !important;
			overflow: hidden;
			}

			body.web {
				background: transparent !important;
				overflow: hidden;
			}
			body {
				margin: 0;
			}
			canvas {
				display: block;
			}
		</style>
	</head>

	<body>
		<script type="importmap">
			{
				"imports": {
					"three": "./node_modules/three/build/three.module.js",
					"three/tsl": "./node_modules/three/build/three.tsl.js",
					"three/addons/": "./node_modules/three/examples/jsm/",
					"@pixiv/three-vrm": "./node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
					"@pixiv/three-vrm/nodes": "./node_modules/@pixiv/three-vrm/lib/nodes/index.module.js",
					"@pixiv/three-vrm-animation": "./node_modules/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.js",
					"@sparkjsdev/spark": "./node_modules/@sparkjsdev/spark/dist/spark.module.js"
				}
			}
		</script>
		<script type="module" src="js/vrm.js"></script>
		
		<!-- Debug面板 -->
		<div id="debug-panel" style="
			position: absolute;
			top: 10px;
			right: 10px;
			background: rgba(0, 0, 0, 0.8);
			color: white;
			padding: 15px;
			border-radius: 8px;
			font-family: Arial, sans-serif;
			font-size: 12px;
			max-width: 300px;
			z-index: 1000;
		">
			<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
				<strong>Debug Panel</strong>
				<button onclick="toggleDebugPanel()" style="background: #444; color: white; border: none; padding: 2px 8px; border-radius: 3px; cursor: pointer;">✕</button>
			</div>
			<div id="animation-buttons" style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
				<!-- 动画按钮将在这里动态生成 -->
			</div>
		</div>
		
		<script>
			// 动画文件列表
			const animationFiles = [
				'akimbo.vrma',
                'dance.vrma',
                'dance2.vrma',
				'cool_roll_show.vrma',
				'cool_side.vrma',
				'cute_jump_and_hello.vrma',
				'play_fingers.vrma',
				'roll_and_show.vrma',
				'scratch_head.vrma',
				'shoot_your_heart.vrma',
				'squats.vrma',
				'stretch.vrma',
				'v_pose.vrma'
			];
			
			// 生成动画按钮
			function generateAnimationButtons() {
				const container = document.getElementById('animation-buttons');
				container.innerHTML = '';
				
				animationFiles.forEach(file => {
					const button = document.createElement('button');
					const buttonText = file.replace('.vrma', '').replace(/_/g, ' ');
					button.textContent = buttonText;
					button.style.cssText = `
						background: #4CAF50;
						color: white;
						border: none;
						padding: 8px 12px;
						border-radius: 4px;
						cursor: pointer;
						font-size: 11px;
						transition: background 0.2s;
					`;
					button.onmouseover = () => button.style.background = '#45a049';
					button.onmouseout = () => button.style.background = '#4CAF50';
					button.onclick = () => {
						const animName = file.replace('.vrma', '');
						console.log(`Debug: Calling chooseAnimationToPlay with animation: ${animName}`);
						if (window.idleAnimationManager && window.idleAnimationManager.chooseAnimationToPlay) {
							window.idleAnimationManager.chooseAnimationToPlay(animName);
						} else {
							console.warn('IdleAnimationManager not available. Make sure VRM model is fully loaded.');
						}
					};
					container.appendChild(button);
				});
			}
			
			// 切换debug面板显示/隐藏
			function toggleDebugPanel() {
				const panel = document.getElementById('debug-panel');
				if (panel.style.display === 'none') {
					panel.style.display = 'block';
				} else {
					panel.style.display = 'none';
				}
			}
			
			// 页面加载完成后生成按钮
			document.addEventListener('DOMContentLoaded', function() {
				generateAnimationButtons();
			});
			
			// 暴露函数到全局作用域
			window.toggleDebugPanel = toggleDebugPanel;
		</script>
	</body>
</html>
